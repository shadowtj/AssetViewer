[package]
name = "asset_viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
egui_extras = { version = "0.27", features = ["image", "all_loaders"] }
eframe = "0.27"
egui = "0.27"
egui_plot = "0.27"
image = { version = "0.24.9", features = ["jpeg", "png"] }

walkdir = "2.5"
rfd = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"
symphonia = { version = "0.5", features = ["mp3", "wav"] }
rodio = "0.19"
easy-gltf = "1.1"
tobj = "4.0"
open = "5.3"
zip = "0.6"
anyhow = "1.0"
thiserror = "1.0"
